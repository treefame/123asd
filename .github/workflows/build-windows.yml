name: Build Sonora Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      # Tauri requires a Windows .ico resource. Generate it on the runner.
      - name: Generate Sonora app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $bmp = [System.Drawing.Bitmap]::new(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(13, 16, 23))
          $green = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(124, 92, 255))
          $white = [System.Drawing.Pen]::new([System.Drawing.Color]::FromArgb(245, 247, 255), 17)
          $white.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $white.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $points = @(
            [System.Drawing.Point]::new(38, 133),
            [System.Drawing.Point]::new(75, 133),
            [System.Drawing.Point]::new(98, 88),
            [System.Drawing.Point]::new(128, 174),
            [System.Drawing.Point]::new(158, 105),
            [System.Drawing.Point]::new(181, 133),
            [System.Drawing.Point]::new(218, 133)
          )
          $g.FillEllipse($green, 12, 12, 232, 232)
          for ($i = 0; $i -lt ($points.Count - 1); $i++) {
            $g.DrawLine($white, $points[$i], $points[$i + 1])
          }
          $bmp.Save("src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $stream = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $g.Dispose()
          $bmp.Dispose()

      - run: npm install
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: Sonora-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
